<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- inryokü favicon: core sphere + binary 0/1 quantum field -->
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%"  stop-color="#e8e8e8" stop-opacity="0.95"/>
      <stop offset="70%"  stop-color="#7a7a7a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="60%"  stop-color="#00ffff" stop-opacity="0"/>
      <stop offset="85%"  stop-color="#ff00ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#000"/>
  <!-- halo aura -->
  <circle cx="32" cy="32" r="30" fill="url(#halo)"/>
  <!-- floating binary: 0 and 1 around the core -->
  <g font-family="'Courier New', monospace" font-weight="700" font-size="9">
    <text x="10" y="18" fill="#00ffff" opacity="0.85">1</text>
    <text x="50" y="16" fill="#ff00ff" opacity="0.75">0</text>
    <text x="8"  y="42" fill="#ff00ff" opacity="0.65">0</text>
    <text x="52" y="46" fill="#00ffff" opacity="0.80">1</text>
    <text x="28" y="10" fill="#ffffff" opacity="0.55">1</text>
    <text x="34" y="60" fill="#ffffff" opacity="0.55">0</text>
    <text x="18" y="58" fill="#00ffff" opacity="0.45" font-size="7">0</text>
    <text x="44" y="58" fill="#ff00ff" opacity="0.45" font-size="7">1</text>
  </g>
  <!-- core sphere -->
  <circle cx="32" cy="32" r="14" fill="url(#core)"/>
  <!-- inner highlight (depth) -->
  <ellipse cx="28" cy="27" rx="5" ry="3.5" fill="#ffffff" opacity="0.45"/>
  <!-- core rim glow -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.6"/>
</svg>
