<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- 07 EYE_OPEN: almond shape, sclera/iris/pupil, grey tones -->
  <defs>
    <radialGradient id="scleraG" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#fefcf5"/>
      <stop offset="100%" stop-color="#d9d6cc"/>
    </radialGradient>
    <radialGradient id="irisG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6e6e73"/>
      <stop offset="55%" stop-color="#3a3a3e"/>
      <stop offset="100%" stop-color="#1a1a1c"/>
    </radialGradient>
    <radialGradient id="lightHalo2" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="rgba(255,255,255,0.65)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <clipPath id="eyeClip">
      <path d="M 220 400 Q 400 240 580 400 Q 400 560 220 400 Z"/>
    </clipPath>
  </defs>
  <rect width="800" height="800" fill="#020204"/>
  <rect width="800" height="800" fill="url(#lightHalo2)"/>

  <!-- eye almond shape (white of eye) -->
  <path d="M 220 400 Q 400 240 580 400 Q 400 560 220 400 Z" fill="url(#scleraG)" stroke="#2a2a2d" stroke-width="3"/>
  <!-- iris and pupil clipped by eye shape -->
  <g clip-path="url(#eyeClip)">
    <circle cx="400" cy="400" r="110" fill="url(#irisG)"/>
    <circle cx="400" cy="400" r="44" fill="#040404"/>
    <!-- catch light -->
    <ellipse cx="380" cy="378" rx="18" ry="12" fill="rgba(255,255,255,0.8)"/>
  </g>
  <!-- lids (thin reinforcement) -->
  <path d="M 220 400 Q 400 240 580 400" fill="none" stroke="#1a1a1b" stroke-width="4"/>
  <path d="M 220 400 Q 400 560 580 400" fill="none" stroke="#1a1a1b" stroke-width="4"/>
</svg>
