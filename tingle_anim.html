<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>inryokü — 101%</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js"}}</script>
<style>
  :root { color-scheme: dark; --dim: hsla(0, 0%, 90%, 0.6); --line: hsla(0, 0%, 100%, 0.22); --accent: hsl(180, 70%, 55%); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: hsl(0, 0%, 90%); font-family: 'VT323', ui-monospace, monospace; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #gate {
    position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px;
    background: hsla(0, 0%, 0%, 0.72); transition: opacity 600ms ease;
  }
  #gate[data-hidden="true"] { opacity: 0; pointer-events: none; }
  #gate h1 { font-weight: 400; font-size: 44px; letter-spacing: 0.2em; margin: 0 0 6px; }
  #gate p { color: var(--dim); font-size: 20px; margin: 0 0 22px; line-height: 1.4; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    appearance: none; font: inherit; font-size: 22px; letter-spacing: 0.06em; color: inherit;
    background: hsla(0, 0%, 10%, 0.85); border: 1px solid var(--line); border-radius: 6px; padding: 10px 18px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom)); text-align: center; color: var(--dim); font-size: 16px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="gate">
  <div>
    <h1>101%</h1>
    <p id="msg">どちらで聴きますか？<br />🎧 ヘッドホンなら、音が頭の周りを回ります</p>
    <div class="row">
      <button type="button" data-out="speakers">🔊 スピーカー</button>
      <button type="button" data-out="headphones">🎧 ヘッドホン</button>
    </div>
  </div>
</div>
<div class="hint" id="hint"></div>

<script type="module">
import { createTingle, SCORES } from './inryoku-tingle.js';
import { createTingleVisual } from './tingle-visual.js';

const SCORE = SCORES.frisson101;
const canvas = document.getElementById('c');
const gate = document.getElementById('gate');
const hint = document.getElementById('hint');
let ctx = null;
let eng = null;
let vis = null;
let start = 0;
let end = 0;

function resize() {
  if (vis) vis.resize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize);

// 実際に耳に届いている時刻 (出力遅延を差し引く) — 映像はこの時刻で描く
function audibleTime() {
  if (ctx.getOutputTimestamp) {
    const ts = ctx.getOutputTimestamp();
    if (ts.contextTime > 0 && ts.performanceTime > 0) return ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
  }
  return ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
}

function play(output) {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  ctx = ctx || new Ctx({ latencyHint: 'interactive' });
  ctx.resume();
  if (eng) eng.dispose();
  eng = createTingle(ctx, { output, events: true, seed: SCORE.seed });
  if (vis) vis.attach(eng);
  else vis = createTingleVisual({ canvas, eng });
  resize();
  start = ctx.currentTime + 0.3;
  end = start + SCORE.dur;
  SCORE.build(eng, start);
  eng.clock();
  gate.dataset.hidden = 'true';
  hint.textContent = output === 'headphones' ? '🎧' : '🔊';
}

document.querySelectorAll('[data-out]').forEach((b) => b.addEventListener('click', () => play(b.dataset.out)));

function frame() {
  if (ctx && vis) {
    const t = audibleTime();
    vis.render(t);
    if (t > end + 0.5 && gate.dataset.hidden === 'true') {
      document.getElementById('msg').innerHTML = 'もう一度';
      gate.dataset.hidden = 'false';
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
