<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>inryokü Sample 04 - Three Layer Glow</title>
<style>
  body{margin:0;background:#000;overflow:hidden;}
  h1{position:fixed;top:8px;left:12px;color:rgba(255,255,255,0.4);font:11px monospace;z-index:10;margin:0;font-weight:normal;}
  canvas{position:fixed;top:0;left:0;width:100%;height:100%;}
</style></head>
<body>
<h1>Sample 04: Three Layer Glow</h1>
<canvas id="cv"></canvas>
<script src="_common.js"></script>
<script>
function drawParticle(ctx, x, y, r, color, rgb){
  const R3 = r * 5.5;
  const g3 = ctx.createRadialGradient(x, y, 0, x, y, R3);
  g3.addColorStop(0,   INRYOKU.rgba(rgb, 0.12));
  g3.addColorStop(0.5, INRYOKU.rgba(rgb, 0.03));
  g3.addColorStop(1,   INRYOKU.rgba(rgb, 0));
  ctx.fillStyle = g3;
  ctx.beginPath(); ctx.arc(x, y, R3, 0, Math.PI*2); ctx.fill();
  const R2 = r * 2.5;
  const g2 = ctx.createRadialGradient(x, y, 0, x, y, R2);
  g2.addColorStop(0,   INRYOKU.rgba(rgb, 0.4));
  g2.addColorStop(0.5, INRYOKU.rgba(rgb, 0.1));
  g2.addColorStop(1,   INRYOKU.rgba(rgb, 0));
  ctx.fillStyle = g2;
  ctx.beginPath(); ctx.arc(x, y, R2, 0, Math.PI*2); ctx.fill();
  const R1 = r * 0.8;
  const g1 = ctx.createRadialGradient(x, y, 0, x, y, R1);
  g1.addColorStop(0, INRYOKU.rgba(rgb, 1));
  g1.addColorStop(1, INRYOKU.rgba(rgb, 0));
  ctx.fillStyle = g1;
  ctx.beginPath(); ctx.arc(x, y, R1, 0, Math.PI*2); ctx.fill();
}
INRYOKU.run(drawParticle);
</script></body></html>
