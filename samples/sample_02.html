<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>inryokü Sample 02 - Gaussian Soft</title>
<style>
  body{margin:0;background:#000;overflow:hidden;}
  h1{position:fixed;top:8px;left:12px;color:rgba(255,255,255,0.4);font:11px monospace;z-index:10;margin:0;font-weight:normal;}
  canvas{position:fixed;top:0;left:0;width:100%;height:100%;}
</style></head>
<body>
<h1>Sample 02: Gaussian Soft</h1>
<canvas id="cv"></canvas>
<script src="_common.js"></script>
<script>
function drawParticle(ctx, x, y, r, color, rgb){
  const R = r * 2.5;
  const g = ctx.createRadialGradient(x, y, 0, x, y, R);
  g.addColorStop(0,    INRYOKU.rgba(rgb, 1.0));
  g.addColorStop(0.4,  INRYOKU.rgba(rgb, 0.35));
  g.addColorStop(0.7,  INRYOKU.rgba(rgb, 0.08));
  g.addColorStop(1,    INRYOKU.rgba(rgb, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, R, 0, Math.PI*2);
  ctx.fill();
}
INRYOKU.run(drawParticle);
</script></body></html>
