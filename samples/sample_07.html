<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>inryokü Sample 07 - Noisy</title>
<style>
  body{margin:0;background:#000;overflow:hidden;}
  h1{position:fixed;top:8px;left:12px;color:rgba(255,255,255,0.4);font:11px monospace;z-index:10;margin:0;font-weight:normal;}
  canvas{position:fixed;top:0;left:0;width:100%;height:100%;}
</style></head>
<body>
<h1>Sample 07: Noisy / Granular</h1>
<canvas id="cv"></canvas>
<script src="_common.js"></script>
<script>
const noiseCache = {};
function getNoiseSprite(rgb, key){
  if (noiseCache[key]) return noiseCache[key];
  const SIZE = 64;
  const off = document.createElement('canvas');
  off.width = SIZE; off.height = SIZE;
  const c = off.getContext('2d');
  const img = c.createImageData(SIZE, SIZE);
  const cx = SIZE/2, cy = SIZE/2;
  for (let j=0; j<SIZE; j++){
    for (let i=0; i<SIZE; i++){
      const dx = i - cx, dy = j - cy;
      const d = Math.sqrt(dx*dx + dy*dy) / (SIZE/2);
      const falloff = Math.max(0, 1 - d);
      const noise = 0.4 + Math.random() * 0.6;
      const a = Math.pow(falloff, 1.4) * noise;
      const idx = (j*SIZE + i) * 4;
      img.data[idx]   = rgb[0];
      img.data[idx+1] = rgb[1];
      img.data[idx+2] = rgb[2];
      img.data[idx+3] = (a * 255) | 0;
    }
  }
  c.putImageData(img, 0, 0);
  noiseCache[key] = off;
  return off;
}
function drawParticle(ctx, x, y, r, color, rgb){
  const sprite = getNoiseSprite(rgb, color);
  const R = r * 2.4;
  ctx.drawImage(sprite, x - R, y - R, R*2, R*2);
}
INRYOKU.run(drawParticle);
</script></body></html>
