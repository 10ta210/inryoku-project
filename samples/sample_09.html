<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>inryokü Sample 09 - Twinkle Star</title>
<style>
  body{margin:0;background:#000;overflow:hidden;}
  h1{position:fixed;top:8px;left:12px;color:rgba(255,255,255,0.4);font:11px monospace;z-index:10;margin:0;font-weight:normal;}
  canvas{position:fixed;top:0;left:0;width:100%;height:100%;}
</style></head>
<body>
<h1>Sample 09: Twinkle / 4-pt Star</h1>
<canvas id="cv"></canvas>
<script src="_common.js"></script>
<script>
function drawParticle(ctx, x, y, r, color, rgb){
  const R = r * 1.4;
  const g = ctx.createRadialGradient(x, y, 0, x, y, R);
  g.addColorStop(0,   INRYOKU.rgba(rgb, 1));
  g.addColorStop(0.5, INRYOKU.rgba(rgb, 0.35));
  g.addColorStop(1,   INRYOKU.rgba(rgb, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.fill();
  const len = r * 8;
  const thin = Math.max(0.6, r * 0.08);
  const gv = ctx.createLinearGradient(x, y - len, x, y + len);
  gv.addColorStop(0,    INRYOKU.rgba(rgb, 0));
  gv.addColorStop(0.5,  INRYOKU.rgba(rgb, 0.9));
  gv.addColorStop(1,    INRYOKU.rgba(rgb, 0));
  ctx.fillStyle = gv;
  ctx.fillRect(x - thin/2, y - len, thin, len*2);
  const gh = ctx.createLinearGradient(x - len, y, x + len, y);
  gh.addColorStop(0,    INRYOKU.rgba(rgb, 0));
  gh.addColorStop(0.5,  INRYOKU.rgba(rgb, 0.9));
  gh.addColorStop(1,    INRYOKU.rgba(rgb, 0));
  ctx.fillStyle = gh;
  ctx.fillRect(x - len, y - thin/2, len*2, thin);
}
INRYOKU.run(drawParticle);
</script></body></html>
