<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>inryokü Sample 08 - Chromatic Aberration</title>
<style>
  body{margin:0;background:#000;overflow:hidden;}
  h1{position:fixed;top:8px;left:12px;color:rgba(255,255,255,0.4);font:11px monospace;z-index:10;margin:0;font-weight:normal;}
  canvas{position:fixed;top:0;left:0;width:100%;height:100%;}
</style></head>
<body>
<h1>Sample 08: Chromatic Aberration</h1>
<canvas id="cv"></canvas>
<script src="_common.js"></script>
<script>
function blob(ctx, x, y, R, rgb, a){
  const g = ctx.createRadialGradient(x, y, 0, x, y, R);
  g.addColorStop(0,   `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`);
  g.addColorStop(0.5, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a*0.25})`);
  g.addColorStop(1,   `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.fill();
}
function drawParticle(ctx, x, y, r, color, rgb){
  const R = r * 2.2;
  const off = Math.max(1, r * 0.35);
  blob(ctx, x - off, y, R, [rgb[0], 0, 0], 0.85);
  blob(ctx, x + off*0.5, y - off*0.5, R, [0, rgb[1], 0], 0.85);
  blob(ctx, x + off*0.5, y + off*0.5, R, [0, 0, rgb[2]], 0.85);
  blob(ctx, x, y, r * 0.7, [255,255,255], 0.15);
}
INRYOKU.run(drawParticle);
</script></body></html>
