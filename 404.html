<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — inryokü — observed but not found</title>
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicons/icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/icon-180.png">
  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      color: rgba(255,255,255,0.85);
      font-family: 'Press Start 2P', 'MS Sans Serif', monospace;
      overflow: hidden;
      cursor: crosshair;
    }
    canvas#field {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      display: block;
      z-index: 0;
    }
    .wrap {
      position: relative; z-index: 1;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 18px;
    }
    .num {
      font-size: clamp(64px, 18vw, 160px);
      font-weight: 900;
      letter-spacing: 0.06em;
      background: linear-gradient(180deg,#fff 0%,#bbb 50%,#888 100%);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      text-shadow:
        0 0 20px rgba(0,255,255,0.18),
        0 0 40px rgba(255,0,255,0.12);
      animation: drift 6s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translateY(-4px) scale(1); }
      to   { transform: translateY(4px) scale(1.02); }
    }
    .msg {
      font-size: clamp(11px, 2.4vw, 14px);
      line-height: 1.9;
      letter-spacing: 0.08em;
      opacity: 0.78;
      max-width: 540px;
    }
    .quote {
      font-style: italic;
      opacity: 0.5;
      font-size: clamp(10px, 1.8vw, 12px);
      max-width: 460px;
      line-height: 1.8;
    }
    a.back {
      display: inline-block;
      margin-top: 8px;
      padding: 12px 28px;
      color: #fff;
      text-decoration: none;
      letter-spacing: 0.14em;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
    }
    a.back:hover {
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.5);
      box-shadow: 0 0 30px rgba(0,255,255,0.15);
      transform: translateY(-2px);
    }
    .meta {
      position: fixed;
      bottom: 14px; left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      letter-spacing: 0.2em;
      opacity: 0.3;
    }
  </style>
</head>
<body>
  <canvas id="field"></canvas>
  <div class="wrap">
    <div class="num">404</div>
    <div class="msg">
      観測点が存在しません。<br>
      Observed but not found.
    </div>
    <div class="quote">
      &ldquo;見えないものは、まだ見えていないだけ。&rdquo;<br>
      — inryokü
    </div>
    <a class="back" href="/">← return to 101%</a>
  </div>
  <div class="meta">/observation/null</div>

  <script>
    // 粒子の宇宙：マウス追従でグレーが虹に揺らぐ
    (function(){
      const c = document.getElementById('field');
      const ctx = c.getContext('2d');
      let W = 0, H = 0;
      const DPR = Math.min(window.devicePixelRatio || 1, 2);
      function resize(){
        W = window.innerWidth; H = window.innerHeight;
        c.width = W * DPR; c.height = H * DPR;
        c.style.width = W + 'px'; c.style.height = H + 'px';
        ctx.setTransform(DPR,0,0,DPR,0,0);
      }
      resize();
      window.addEventListener('resize', resize);

      const N = Math.min(220, Math.floor((W*H)/9000));
      const COLORS = [
        'rgba(255,0,0,0.7)',
        'rgba(255,128,0,0.65)',
        'rgba(255,255,0,0.6)',
        'rgba(0,255,128,0.6)',
        'rgba(0,255,255,0.7)',
        'rgba(128,0,255,0.65)',
      ];
      const ps = [];
      for (let i=0; i<N; i++){
        ps.push({
          x: Math.random()*W,
          y: Math.random()*H,
          vx: (Math.random()-0.5)*0.25,
          vy: (Math.random()-0.5)*0.25,
          r: Math.random()*1.6 + 0.4,
          c: COLORS[i % COLORS.length],
          baseAlpha: 0.15 + Math.random()*0.5,
          phase: Math.random()*Math.PI*2,
        });
      }
      let mx = W/2, my = H/2;
      window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
      window.addEventListener('touchmove', e => {
        if (e.touches[0]) { mx = e.touches[0].clientX; my = e.touches[0].clientY; }
      }, {passive:true});

      let t = 0;
      function frame(){
        t += 0.016;
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.fillRect(0,0,W,H);
        for (const p of ps){
          // 観測（マウス近接）で色が出る
          const dx = p.x - mx, dy = p.y - my;
          const d = Math.sqrt(dx*dx + dy*dy);
          const near = Math.max(0, 1 - d/220);
          p.vx += (dx/(d+1)) * near * 0.04;
          p.vy += (dy/(d+1)) * near * 0.04;
          p.vx *= 0.985; p.vy *= 0.985;
          p.x += p.vx; p.y += p.vy;
          if (p.x < -10) p.x = W+10;
          if (p.x > W+10) p.x = -10;
          if (p.y < -10) p.y = H+10;
          if (p.y > H+10) p.y = -10;
          const pulse = (Math.sin(t*1.7 + p.phase)*0.5+0.5);
          const a = p.baseAlpha * (0.35 + 0.65*pulse) + near*0.4;
          ctx.fillStyle = near > 0.05 ? p.c : 'rgba(180,180,180,'+a+')';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r + near*1.4, 0, Math.PI*2);
          ctx.fill();
        }
        requestAnimationFrame(frame);
      }
      frame();
    })();
  </script>
</body>
</html>
