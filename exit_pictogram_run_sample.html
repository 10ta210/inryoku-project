<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inryokü Exit Pictogram Run Sample</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020302;
    color: rgba(255,255,255,0.72);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  .scene {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 52% 48%, rgba(0,255,96,0.12), transparent 28%),
      linear-gradient(180deg, #020302 0%, #000 100%);
  }
  .sign {
    position: relative;
    width: min(860px, 88vw);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border: 1px solid rgba(0,255,112,0.28);
    border-radius: 18px;
    background:
      linear-gradient(90deg, rgba(0,255,112,0.05), rgba(0,255,112,0.12), rgba(0,255,112,0.05)),
      #001a0a;
    box-shadow:
      0 0 20px rgba(0,255,112,0.18),
      0 0 80px rgba(0,255,112,0.12),
      inset 0 0 80px rgba(0,255,112,0.10);
  }
  .sign::before {
    content: "";
    position: absolute;
    inset: -20%;
    background:
      repeating-linear-gradient(
        0deg,
        transparent 0 8px,
        rgba(255,255,255,0.025) 9px 10px
      );
    animation: scan 4s linear infinite;
    mix-blend-mode: screen;
    pointer-events: none;
  }
  .sign::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 0 38%, rgba(255,255,255,0.14) 47%, transparent 58%);
    transform: translateX(-120%);
    animation: sweep 5.2s ease-in-out infinite;
    pointer-events: none;
  }
  .exit-door {
    position: absolute;
    right: 10%;
    bottom: 18%;
    width: 20%;
    height: 54%;
    border: 10px solid rgba(235,255,238,0.94);
    border-left: 0;
    filter: drop-shadow(0 0 16px rgba(185,255,195,0.52));
  }
  .arrow {
    position: absolute;
    right: 33%;
    top: 46%;
    width: 20%;
    height: 10px;
    background: rgba(235,255,238,0.94);
    filter: drop-shadow(0 0 12px rgba(185,255,195,0.45));
  }
  .arrow::after {
    content: "";
    position: absolute;
    right: -1px;
    top: 50%;
    width: 34px;
    height: 34px;
    border-top: 10px solid rgba(235,255,238,0.94);
    border-right: 10px solid rgba(235,255,238,0.94);
    transform: translateY(-50%) rotate(45deg);
  }
  .runner-wrap {
    position: absolute;
    left: 10%;
    bottom: 20%;
    width: 35%;
    height: 54%;
    animation: runTravel 1.9s cubic-bezier(.42,0,.35,1) infinite;
    filter: drop-shadow(0 0 14px rgba(220,255,224,0.60));
  }
  svg.runner {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .runner * {
    fill: none;
    stroke: rgba(238,255,240,0.98);
    stroke-width: 15;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .head { fill: rgba(238,255,240,0.98); stroke: none; }
  .body {
    transform-origin: 155px 112px;
    animation: bodyBob .38s ease-in-out infinite alternate;
  }
  .arm-front {
    transform-origin: 160px 112px;
    animation: armFront .38s ease-in-out infinite alternate;
  }
  .arm-back {
    transform-origin: 160px 112px;
    animation: armBack .38s ease-in-out infinite alternate;
  }
  .leg-front {
    transform-origin: 158px 152px;
    animation: legFront .38s ease-in-out infinite alternate;
  }
  .leg-back {
    transform-origin: 158px 152px;
    animation: legBack .38s ease-in-out infinite alternate;
  }
  .afterimage {
    opacity: 0.22;
    transform: translateX(-34px);
    filter: blur(0.6px);
  }
  .afterimage.two {
    opacity: 0.10;
    transform: translateX(-64px);
    filter: blur(1.1px);
  }
  .caption {
    position: fixed;
    left: 22px;
    bottom: 20px;
    max-width: min(560px, calc(100vw - 44px));
    pointer-events: none;
  }
  .caption h1 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.34em;
    text-transform: uppercase;
  }
  .caption p {
    margin: 0;
    font-size: 10px;
    line-height: 1.75;
    letter-spacing: 0.10em;
    color: rgba(255,255,255,0.42);
  }
  .code {
    position: absolute;
    inset: 0;
    opacity: 0.22;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 35%, rgba(0,255,255,0.22) 0 1px, transparent 2px),
      radial-gradient(circle at 55% 58%, rgba(255,0,255,0.18) 0 1px, transparent 2px),
      radial-gradient(circle at 72% 24%, rgba(255,255,0,0.16) 0 1px, transparent 2px);
    background-size: 46px 46px, 61px 61px, 73px 73px;
    animation: drift 9s linear infinite;
  }
  @keyframes runTravel {
    0% { transform: translateX(-2%) translateY(0); }
    45% { transform: translateX(28%) translateY(-1.5%); }
    72% { transform: translateX(36%) translateY(0); }
    100% { transform: translateX(-2%) translateY(0); }
  }
  @keyframes bodyBob {
    0% { transform: translateY(4px) rotate(-2deg); }
    100% { transform: translateY(-4px) rotate(3deg); }
  }
  @keyframes armFront {
    0% { transform: rotate(22deg); }
    100% { transform: rotate(-25deg); }
  }
  @keyframes armBack {
    0% { transform: rotate(-26deg); }
    100% { transform: rotate(24deg); }
  }
  @keyframes legFront {
    0% { transform: rotate(-26deg); }
    100% { transform: rotate(26deg); }
  }
  @keyframes legBack {
    0% { transform: rotate(24deg); }
    100% { transform: rotate(-24deg); }
  }
  @keyframes scan {
    0% { transform: translateY(-24px); }
    100% { transform: translateY(24px); }
  }
  @keyframes sweep {
    0%, 62% { transform: translateX(-120%); }
    100% { transform: translateX(120%); }
  }
  @keyframes drift {
    0% { background-position: 0 0, 0 0, 0 0; }
    100% { background-position: 92px 46px, -61px 122px, 146px -73px; }
  }
  @media (max-width: 720px) {
    .sign { width: 94vw; border-radius: 14px; }
    .runner * { stroke-width: 17; }
    .caption { display: none; }
  }
</style>
</head>
<body>
<div class="scene">
  <div class="sign" aria-label="running exit pictogram animation">
    <div class="code"></div>
    <div class="exit-door"></div>
    <div class="arrow"></div>
    <div class="runner-wrap">
      <svg class="runner afterimage two" viewBox="0 0 320 220" aria-hidden="true">
        <circle class="head" cx="154" cy="48" r="23"/>
        <path class="body" d="M152 78 L132 124 L166 154"/>
        <path class="arm-front" d="M142 94 L98 116"/>
        <path class="arm-back" d="M148 96 L198 88"/>
        <path class="leg-front" d="M166 154 L214 182"/>
        <path class="leg-back" d="M160 154 L112 194"/>
      </svg>
      <svg class="runner afterimage" viewBox="0 0 320 220" aria-hidden="true">
        <circle class="head" cx="154" cy="48" r="23"/>
        <path class="body" d="M152 78 L132 124 L166 154"/>
        <path class="arm-front" d="M142 94 L98 116"/>
        <path class="arm-back" d="M148 96 L198 88"/>
        <path class="leg-front" d="M166 154 L214 182"/>
        <path class="leg-back" d="M160 154 L112 194"/>
      </svg>
      <svg class="runner" viewBox="0 0 320 220" aria-hidden="true">
        <circle class="head" cx="154" cy="48" r="23"/>
        <path class="body" d="M152 78 L132 124 L166 154"/>
        <path class="arm-front" d="M142 94 L98 116"/>
        <path class="arm-back" d="M148 96 L198 88"/>
        <path class="leg-front" d="M166 154 L214 182"/>
        <path class="leg-back" d="M160 154 L112 194"/>
      </svg>
    </div>
  </div>
</div>
<div class="caption">
  <h1>Emergency Exit Pictogram Motion</h1>
  <p>ただ逃げるマークではなく、コード世界から外側へ出る人。非常口の記号を inryokü 的な「出口 / 生成 / 移動」に変換する。</p>
</div>
</body>
</html>
