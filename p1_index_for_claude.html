  <style>
    /* ───────────────────────────────────────────────
       2026-05-20 段階20.4: OKLCH 哲学カラートークン (Codex Opus 推薦)
       知覚均等な色補間 = 「グレーの中の虹」の物理的実装
       sRGB hex は灰色化・ステップ感が出るため OKLCH に統一
       rollback: この :root 1 ブロックを戻すだけ
       ─────────────────────────────────────────────── */
    :root {
      /* 50% コア (現実=グレー) */
      --ink-void:     oklch(8%  0 0);           /* 純黒 (CMY 合一) */
      --ink-grey:     oklch(55% 0 0);           /* グレー = 現実 */
      --ink-paper:    oklch(98% 0 0);           /* 純白 (RGB 合一) */
      /* 7色虹 (knee 点ごとに彩度ピーク、知覚均等) */
      --rainbow-r:    oklch(65% 0.24  25);
      --rainbow-o:    oklch(72% 0.20  55);
      --rainbow-y:    oklch(90% 0.19  95);
      --rainbow-g:    oklch(78% 0.22 145);
      --rainbow-c:    oklch(80% 0.13 200);
      --rainbow-b:    oklch(58% 0.22 260);
      --rainbow-v:    oklch(58% 0.24 305);
      --rainbow-m:    oklch(68% 0.27 335);
      /* Win95 native palette (機械感維持のため hex のまま) */
      --win95-bg:     #c0c0c0;
      --win95-shadow: #808080;
      --win95-light:  #ffffff;
      --win95-dark:   #000000;
      --win95-blue:   #0000aa;
      /* グラデーション (in oklch longer hue で虹の正しい補間) */
      --grad-rainbow: linear-gradient(90deg in oklch longer hue,
        var(--rainbow-r), var(--rainbow-o), var(--rainbow-y),
        var(--rainbow-g), var(--rainbow-c), var(--rainbow-b),
        var(--rainbow-v), var(--rainbow-m));
      --grad-rainbow-flow: linear-gradient(90deg in oklch longer hue,
        var(--rainbow-r) 0%, var(--rainbow-y) 25%, var(--rainbow-g) 50%,
        var(--rainbow-c) 65%, var(--rainbow-b) 80%, var(--rainbow-m) 100%);
    }
    /* prefers-reduced-motion: 彩度を下げる (光過敏配慮) */
    @media (prefers-reduced-motion: reduce) {
      :root {
        --rainbow-r: oklch(65% 0.12  25);
        --rainbow-o: oklch(72% 0.10  55);
        --rainbow-y: oklch(90% 0.10  95);
        --rainbow-g: oklch(78% 0.11 145);
        --rainbow-c: oklch(80% 0.07 200);
        --rainbow-b: oklch(58% 0.11 260);
        --rainbow-v: oklch(58% 0.12 305);
        --rainbow-m: oklch(68% 0.13 335);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background: var(--ink-void); }
    #root { width: 100%; height: 100%; position: relative; overflow: hidden; }

    /* Welcome画面 (Web 1.0) */
    .phase-1 {
      background: var(--ink-grey);
      padding: 40px 20px;
      overflow-y: auto;
      height: 100%;
    }
    .phase-1 center { max-width: 600px; margin: 0 auto; }
  </style>
</head>
<body>
  <script>
    if (/iPhone|Android|iPad.*Mobile/i.test(navigator.userAgent)) { window.location.href = '/p3_test.html'; }
  </script>
  <div id="root"></div>

  <!-- 2026-05-20 段階20: harmonic drone (110Hz A2 + overtones) — 哲学音響 -->
  <script src="cosmos-audio-harmonic.js?v=20260520lens1"></script>
  <!-- 2026-05-31: 進行=taichi(ローディング駆動エンジン) / 球描画=v2(立体ライティング)。
       taichi の球は v2 起動時に非表示化され二重にならない (init で getObjectByName 抑制)。
       genesis(ONE BREATH 完全再設計)は進行ロジック統合が未完のため温存。 -->
  <script src="p1_v2_sphere.js?v=20260608auto1"></script>
  <!-- <script src="p1_genesis.js?v=20260531genesis1"></script> -->
  <!-- P1 Stage 1 拡張シーン (2026-05-17 太極→グレー溶解 / 2026-05-18 Stage 13 clean reset) -->
  <!-- 2026-05-31 司「v2 の球が良い・二重を消す」: p1_v2_sphere.js を本番デフォルト化したため
       旧 taichi(球を二重に描く 186KB)を停止。戻す時はこの行を復活 + p1_v2_sphere に ?v2=0。 -->
  <script src="p1_stage1_taichi.js?v=20260520morph1"></script>
  <!-- 2026-05-18 Stage 13 (clean reset): Stage 6 (eye) / Stage 7 (cross) を再有効化。
       Stage 5 (white world) は p1_stage1_taichi.js の uWhiteBirth に inlined されたため
       一旦コメントアウト維持。Stage 3 (tunnel) は chaos 扱いで停止のまま。 -->
  <!-- <script src="p1_stage3_tunnel.js?v=20260517"></script> -->
  <!-- <script src="p1_stage5_white.js?v=20260518"></script> -->
  <!-- 2026-05-20 Codex: eye/cross は同一球体 shader に統合。別 mesh plane は読み込まない。 -->
  <!-- <script src="p1_stage6_eye.js?v=20260518s13"></script> -->
  <!-- <script src="p1_stage7_cross.js?v=20260518s13"></script> -->

  <!-- P1コード -->
  <script src="p1_code_for_claude.js?v=20260608fuse2"></script>
  <!-- P1 only: P2/P3 scripts are intentionally not loaded on this verification page. -->

  <script>
    // モバイル検出: P0/P1/P2をスキップしてP3直行
    var __inryokuMobile = (function() {
        var isMobile = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
                       || (window.innerWidth < 768 && 'ontouchstart' in window);
        if (isMobile) {
            // P3のスクリプトは既に<script>タグで読み込み済み
            // DOMContentLoaded後にrenderPhase3()を直接呼ぶ
            document.addEventListener('DOMContentLoaded', function() {
                renderPhase3();
            });
        }
        return isMobile;
    })();

    if (!__inryokuMobile) {
        // デスクトップ: P0→P1→P2→P3 フルシーケンス
        renderPhase1();

        // 2026-05-18 開発用: ?dev=1 / ?skip=intro / ?at=50 / ?p1time=1 時のみ
        // 画面右上に時間オーバーレイ + PAUSE/RESUME ボタン
        (function devTimeOverlay() {
            if (!/[\?&](dev=1|skip=intro|at=50|p1time=1)/.test(location.search)) return;

            // ── PAUSE 実装: rAF を捕獲して止める ──
            var _origRAF = window.requestAnimationFrame.bind(window);
            var _pendingCbs = [];
            var _paused = false;
            window.requestAnimationFrame = function(cb) {
                if (_paused) { _pendingCbs.push(cb); return 0; }
                return _origRAF(cb);
            };
            function setPaused(p) {
                if (p === _paused) return;
                _paused = p;
                if (!_paused) {
                    var cbs = _pendingCbs.slice(); _pendingCbs.length = 0;
                    cbs.forEach(function(cb) { try { _origRAF(cb); } catch(e){} });
                }
                if (btn) {
                    btn.textContent = _paused ? '▶ RESUME' : '⏸ PAUSE';
                    btn.style.background = _paused ? 'rgba(0,200,80,0.85)' : 'rgba(220,30,30,0.85)';
                }
            }
            window.__inryokuP1Debug = {
                pause:  function() { setPaused(true); },
                resume: function() { setPaused(false); },
                toggle: function() { setPaused(!_paused); },
                state:  function() { return { paused: _paused, pending: _pendingCbs.length }; }
            };

            // ── オーバーレイ DOM ──
            var div = document.createElement('div');
            div.id = 'p1-dev-time-overlay';
            Object.assign(div.style, {
                position: 'fixed', top: '8px', right: '12px',
                zIndex: '2147483647',
                font: '600 11px/1.3 ui-monospace, Menlo, Consolas, monospace',
                color: 'rgba(255,255,255,0.88)',
                background: 'rgba(0,0,0,0.62)',
                padding: '6px 10px', borderRadius: '6px',
                letterSpacing: '0.04em',
                textShadow: '0 0 4px rgba(0,0,0,0.8)',
                backdropFilter: 'blur(4px)',
                userSelect: 'text',
                pointerEvents: 'auto',
                display: 'flex', flexDirection: 'column', gap: '4px',
                alignItems: 'flex-end',
                minWidth: '180px'
            });
            var lineTime = document.createElement('div'); lineTime.textContent = 'P1 init...';
            div.appendChild(lineTime);
            var btn = document.createElement('button');
            btn.textContent = '⏸ PAUSE';
            Object.assign(btn.style, {
                font: '600 10px/1 ui-monospace, monospace',
                color: '#fff',
                background: 'rgba(220,30,30,0.85)',
                border: '1px solid rgba(255,255,255,0.3)',
                borderRadius: '4px',
                padding: '4px 10px',
                cursor: 'pointer',
                letterSpacing: '0.1em'
            });
            btn.onclick = function(){ setPaused(!_paused); };
            div.appendChild(btn);
            document.body.appendChild(div);

            // 2026-05-18: 時間累積方式に変更 — pause 中は進めない
            var elapsedSec = 0;
            var lastT = performance.now();
            var phases = [
                { at: 0,    name: 'P1 start' },
                { at: 1.2,  name: 'Scene A end / Morph start' },
                { at: 5.7,  name: 'タメ→内部上昇' },
                { at: 9.0,  name: '急跳躍 start' },
                { at: 10.2, name: '100% plateau' },
                { at: 11.7, name: 'BREAKTHROUGH (101%)' },
                { at: 14.1, name: 'Ingest end' },
                { at: 14.4, name: 'BIG BANG' },
                { at: 18.4, name: 'Tunnel end' },
                { at: 19.5, name: 'White world end' },
                { at: 22.2, name: 'Eye complete' },
                { at: 24.8, name: 'Cross flash' }
            ];
            function tick() {
                var now = performance.now();
                var dt = now - lastT;
                lastT = now;
                if (!_paused) elapsedSec += dt / 1000;
                var s = elapsedSec;
                var phase = phases[0].name;
                for (var i = 0; i < phases.length; i++) {
                    if (s >= phases[i].at) phase = phases[i].name;
                }
                // 球の uReveal を読めれば %% も併記
                var pct = '';
                try {
                    var s1 = window.inryokuP1Stage1;
                    if (s1 && s1.mat && s1.mat.uniforms && s1.mat.uniforms.uReveal) {
                        var rv = s1.mat.uniforms.uReveal.value;
                        var prog = 50 + rv * 51;
                        pct = ' | ' + prog.toFixed(1) + '%';
                    }
                } catch(e) {}
                lineTime.textContent = 'P1 ' + s.toFixed(2) + 's | ' + phase + pct;
                _origRAF(tick);   // pause 中でも時計は止めない
            }
            _origRAF(tick);
        })();

        // 2026-05-17 開発用: ?dev=1 or ?skip=intro で Welcome画面を自動スキップ
        // → Win95ローディング直行（P1演出をすぐ見たい時用）
        // 本番アクセスは無関係（パラメータ無しなら従来通り）
        (function devSkipIntro() {
            if (!/[\?&](dev=1|skip=intro|at=50)/.test(location.search)) return;
            console.log('[P1 dev] auto-skip intro enabled');
            var attempts = 0;
            var iv = setInterval(function() {
                attempts++;
                var btn = document.getElementById('evolve-btn');
                if (btn) {
                    btn.disabled = false;
                    btn.classList.remove('p0-disabled');
                    btn.click();
                    clearInterval(iv);
                    console.log('[P1 dev] ENTER auto-clicked');
                }
                if (attempts > 150) { clearInterval(iv); } // 30秒で諦め
            }, 200);
        })();

        // 2026-05-17 開発用: ?at=50 で P1 prog を 0→50 まで 20倍速で早送り
        // 50%到達イベント (inryoku:p1_50percent) で等倍に戻す
        // 本番アクセスは無関係（パラメータ無しなら _p1FastForward は undefined → 1扱い）
        (function devFastForwardTo50() {
            if (!/[\?&]at=50/.test(location.search)) return;
            window._p1FastForward = 20;
            console.log('[P1 dev] fast-forward x20 until 50% mark');
            window.addEventListener('inryoku:p1_50percent', function once() {
                window._p1FastForward = 1;
                window.removeEventListener('inryoku:p1_50percent', once);
                console.log('[P1 dev] 50% reached — speed reset to x1');
            });
        })();

        // 2026-05-18 段階16: P1-only mode flag — P2/P3 へ飛ばさない
        window.P1_ONLY_MODE = true;

        // P1完了 → P2起動 (P1_ONLY_MODE=true なら起動しない)
        window.addEventListener('inryoku:p1complete', () => {
          if (window.P1_ONLY_MODE !== false) {
            console.log('[P1-only] p1complete fired but P2 not started');
            return;
          }
          console.log('✅ P1 complete — starting P2');
          renderPhase2();
        });

        // P2完了 → P3起動 (P1_ONLY_MODE=true なら起動しない)
        window.addEventListener('inryoku:p2complete', () => {
          if (window.P1_ONLY_MODE !== false) {
            console.log('[P1-only] p2complete fired but P3 not started');
            return;
          }
          console.log('✅ P2 complete — starting P3');
          renderPhase3();
        });
    }
  </script>
