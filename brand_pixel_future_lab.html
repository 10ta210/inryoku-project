<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inryoku future pixel lab</title>
<style>
@font-face {
  font-family: "Press Start 2P";
  src: url("vendor/fonts/press-start-2p.woff2") format("woff2");
  font-display: swap;
}

:root {
  --grey: #808080;
  --r: #ff0000;
  --g: #00ff00;
  --b: #0044ff;
  --c: #00ffff;
  --m: #ff00ff;
  --y: #ffff00;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 18%, rgba(255,255,255,0.04), transparent 8%),
    radial-gradient(circle at 16% 70%, rgba(0,255,255,0.034), transparent 24%),
    radial-gradient(circle at 86% 28%, rgba(255,0,255,0.03), transparent 20%),
    #000;
}

.page {
  position: relative;
  z-index: 1;
  padding: 28px clamp(14px, 3vw, 42px) 58px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 22px;
  padding-bottom: 22px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

h1 {
  margin: 0;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.76);
}

.note {
  margin: 8px 0 0;
  color: rgba(255,255,255,0.42);
  font-size: 10px;
  letter-spacing: 0.14em;
  line-height: 1.7;
}

.nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.nav a {
  color: rgba(255,255,255,0.72);
  border: 1px solid rgba(255,255,255,0.14);
  text-decoration: none;
  padding: 10px 12px;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  margin-top: 20px;
}

.card {
  position: relative;
  min-height: 222px;
  overflow: hidden;
  padding: 18px 16px 15px;
  border: 1px solid rgba(255,255,255,0.075);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.026), rgba(255,255,255,0.006)),
    #000;
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent),
    repeating-linear-gradient(0deg, transparent 0 10px, rgba(255,255,255,0.018) 10px 11px);
  transform: translateX(-125%);
  animation: sweep 8s ease-in-out infinite;
}

@keyframes sweep {
  0%, 66% { transform: translateX(-125%); opacity: 0; }
  76% { opacity: 1; }
  100% { transform: translateX(125%); opacity: 0; }
}

.meta {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 34px;
  color: rgba(255,255,255,0.42);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.brand {
  display: flex;
  justify-content: center;
  align-items: end;
  min-height: 98px;
  white-space: nowrap;
  line-height: 0.86;
  font-family: "Press Start 2P", monospace;
  font-size: clamp(24px, 4.4vw, 56px);
  letter-spacing: 0.02em;
  image-rendering: pixelated;
  -webkit-font-smoothing: none;
  transform-style: preserve-3d;
}

.brand span {
  --col: #fff;
  display: inline-block;
  position: relative;
  color: var(--col);
}

.brand span:nth-child(1) { --col: var(--grey); }
.brand span:nth-child(2) { --col: var(--r); }
.brand span:nth-child(3) { --col: var(--g); }
.brand span:nth-child(4) { --col: var(--b); }
.brand span:nth-child(5) { --col: var(--c); }
.brand span:nth-child(6) { --col: var(--m); }
.brand span:nth-child(7) { --col: var(--y); }

.desc {
  margin-top: 30px;
  color: rgba(255,255,255,0.34);
  font-size: 9px;
  letter-spacing: 0.12em;
  line-height: 1.75;
}

.f01 .brand { letter-spacing: -0.03em; transform: scaleX(0.78); }
.f01 .brand span { color: transparent; -webkit-text-stroke: 1px var(--col); filter: drop-shadow(0 0 7px color-mix(in srgb, var(--col) 26%, transparent)); }
.f01 .brand span::after { content: attr(data-ch); position: absolute; inset: 0; transform: translate(0.7px, 0); color: color-mix(in srgb, var(--col) 12%, transparent); }

.f02 .brand { letter-spacing: 0.035em; }
.f02 .brand span { clip-path: polygon(0 0, 100% 0, 100% 28%, 74% 28%, 74% 42%, 100% 42%, 100% 100%, 0 100%, 0 66%, 18% 66%, 18% 52%, 0 52%); text-shadow: 0 0 9px color-mix(in srgb, var(--col) 28%, transparent); }

.f03 .brand { letter-spacing: 0.07em; transform: perspective(620px) rotateX(18deg); }
.f03 .brand span { color: transparent; -webkit-text-stroke: 0.8px var(--col); }
.f03 .brand span::before { content: attr(data-ch); position: absolute; inset: 0; transform: translateY(5px) scaleY(0.42); transform-origin: 50% 100%; color: color-mix(in srgb, var(--col) 18%, transparent); filter: blur(0.2px); }

.f04 .brand { letter-spacing: -0.02em; }
.f04 .brand span { color: color-mix(in srgb, var(--col) 68%, white 6%); }
.f04 .brand span::after { content: ""; position: absolute; left: 4%; right: 4%; top: 50%; height: 1px; background: currentColor; box-shadow: 0 0 8px currentColor; opacity: 0.34; }

.f05 .brand { letter-spacing: -0.035em; transform: scaleX(0.82); }
.f05 .brand span { color: color-mix(in srgb, var(--col) 64%, white 4%); text-shadow: -0.45px 0 rgba(255,0,0,0.38), 0.45px 0 rgba(0,255,255,0.38), 0 -0.45px rgba(255,255,0,0.26), 0 0.45px rgba(255,0,255,0.22); }

.f06 .brand { letter-spacing: 0.02em; }
.f06 .brand span { color: transparent; background: linear-gradient(180deg, #fff 0%, var(--col) 22%, #020202 52%, var(--col) 78%, #fff 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 8px color-mix(in srgb, var(--col) 22%, transparent)); }

.f07 .brand { letter-spacing: 0.02em; transform: skewX(-7deg) scaleX(0.88); }
.f07 .brand span { color: transparent; -webkit-text-stroke: 1px var(--col); }
.f07 .brand span::before, .f07 .brand span::after { content: attr(data-ch); position: absolute; inset: 0; opacity: 0.32; pointer-events: none; }
.f07 .brand span::before { color: #ff0000; transform: translate(-0.55px, -0.3px); }
.f07 .brand span::after { color: #00ffff; transform: translate(0.55px, 0.3px); }

.f08 .brand { letter-spacing: -0.04em; transform: scaleX(0.72); }
.f08 .brand span { color: var(--col); text-shadow: 0 0 4px color-mix(in srgb, var(--col) 26%, transparent); }
.f08 .brand span:nth-child(odd) { transform: translateY(-4px); }
.f08 .brand span:nth-child(even) { transform: translateY(3px); }

.f09 .brand { letter-spacing: 0.01em; }
.f09 .brand span { color: color-mix(in srgb, var(--col) 64%, white 5%); animation: pulse 4.8s ease-in-out infinite; animation-delay: calc(var(--i) * -0.15s); }
@keyframes pulse { 0%,100% { transform: translateY(0) scale(1); filter: brightness(1); } 50% { transform: translateY(-3px) scale(1.04); filter: brightness(1.24); } }

.f10 .brand { letter-spacing: 0.055em; font-size: clamp(22px, 4vw, 50px); }
.f10 .brand span { color: transparent; -webkit-text-stroke: 0.9px var(--col); }
.f10 .brand span::after { content: attr(data-ch); position: absolute; inset: 0; transform: translate(2px, 2px); color: transparent; -webkit-text-stroke: 0.9px color-mix(in srgb, var(--col) 18%, transparent); }

.f11 .brand { letter-spacing: 0.04em; transform: perspective(720px) rotateX(8deg) rotateY(-12deg); }
.f11 .brand span { text-shadow: 1px 1px 0 #000, 2px 2px 0 #000, 3px 3px 0 rgba(0,0,0,0.75), 5px 5px 16px rgba(0,0,0,0.86), 0 0 10px color-mix(in srgb, var(--col) 24%, transparent); }

.f12 .brand { letter-spacing: -0.01em; transform: scaleX(0.88); }
.f12 .brand span { color: transparent; -webkit-text-stroke: 0.9px color-mix(in srgb, var(--col) 86%, white 4%); }
.f12 .brand span:nth-child(1) { transform: scaleX(0.62); }
.f12 .brand span:nth-child(1)::after { content: ""; position: absolute; top: -0.14em; left: 50%; width: 0.095em; height: 0.095em; border-radius: 999px; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.52), 0 0 20px rgba(0,255,255,0.22); transform: translateX(-50%); }

.f13 .brand { letter-spacing: 0.08em; transform: scaleX(0.68); }
.f13 .brand span { color: transparent; -webkit-text-stroke: 0.85px var(--col); }
.f13 .brand span::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 32%; border-top: 1px solid currentColor; opacity: 0.7; }

.f14 .brand { letter-spacing: 0.02em; transform: scaleY(1.18); }
.f14 .brand span { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--col) 22%, transparent)); clip-path: polygon(0 0, 88% 0, 100% 16%, 100% 100%, 12% 100%, 0 84%); }

.f15 .brand { letter-spacing: 0.012em; }
.f15 .brand span { color: color-mix(in srgb, var(--col) 58%, transparent); }
.f15 .brand span::before { content: attr(data-ch); position: absolute; inset: 0; transform: translateY(-2px); color: var(--col); opacity: 0.24; }
.f15 .brand span::after { content: attr(data-ch); position: absolute; inset: 0; transform: translateY(2px); color: var(--col); opacity: 0.14; }

.f16 .brand { letter-spacing: -0.02em; transform: scaleX(0.9); }
.f16 .brand span { color: color-mix(in srgb, var(--col) 74%, white 4%); }
.f16 .brand span::after { content: ""; position: absolute; inset: 10% -4%; border: 1px solid currentColor; opacity: 0.12; transform: skewX(-8deg); }

@media (max-width: 900px) {
  .grid { grid-template-columns: 1fr; }
  .top { display: block; }
  .nav { margin-top: 16px; }
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <h1>future pixel lab / 16</h1>
      <p class="note">ピクセル骨格を残して、もっと最先端・SF・コア生成寄りに押した案。</p>
    </div>
    <nav class="nav">
      <a href="brand_pixel_lab_20.html">pixel 20</a>
      <a href="p3_test.html?nocache=20260509-corelogo1">P3</a>
    </nav>
  </header>
  <main class="grid" id="grid"></main>
</div>

<script>
const ideas = [
  ["01", "Quantum Wire", "細線 + 微残像。最有力系"],
  ["02", "Cut Future", "切り欠きで新しいピクセル感"],
  ["03", "Depth Grid", "奥へ倒れる構造"],
  ["04", "Axis Core", "中心線が入る構造ロゴ"],
  ["05", "Prism Drift", "微細屈折"],
  ["06", "Chrome Pixel", "金属反射ピクセル"],
  ["07", "Slant Split", "前傾 + 色分離"],
  ["08", "Broken Orbit", "上下に浮く非同期文字"],
  ["09", "Living Signal", "呼吸するロゴ"],
  ["10", "Ghost Wire", "薄い二重輪郭"],
  ["11", "Deep Extrude", "3D押し出し"],
  ["12", "Core i", "iを核にする"],
  ["13", "Top Rail", "上辺だけ構造化"],
  ["14", "Facet Pixel", "面で切った未来文字"],
  ["15", "Echo Layers", "時間差残像"],
  ["16", "Frame Glyph", "フレーム内に収める"]
];

function brand() {
  return ["i","n","r","y","o","k","ü"]
    .map((ch, i) => `<span data-ch="${ch}" style="--i:${i}">${ch}</span>`)
    .join("");
}

document.getElementById("grid").innerHTML = ideas.map(([num, title, desc], i) => `
  <section class="card f${String(i + 1).padStart(2, "0")}">
    <div class="meta"><span>${num} / ${title}</span><span>future pixel</span></div>
    <div class="brand">${brand()}</div>
    <div class="desc">${desc}</div>
  </section>
`).join("");
</script>
</body>
</html>
