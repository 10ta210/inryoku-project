<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="offline.meta.title">inryokü — the connection is grey</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="/inryoku_logo_icon.png" type="image/png">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0a0a0a;color:#a8a8a8;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;line-height:1.7;letter-spacing:.04em}
  .grey-orb{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5a5a5a 0%,#2a2a2a 55%,#0a0a0a 100%);box-shadow:0 0 60px rgba(120,120,120,.18),inset 0 0 24px rgba(0,0,0,.6);margin-bottom:36px;animation:breathe 4.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.04);opacity:1}}
  .label{font-size:11px;letter-spacing:.32em;color:#5a5a5a;text-transform:uppercase;margin-bottom:18px}
  h1{font-weight:300;font-size:22px;letter-spacing:.18em;color:#cfcfcf;margin-bottom:28px}
  p{max-width:460px;font-size:13px;color:#888;margin-bottom:14px}
  p.jp{color:#9a9a9a;font-size:12.5px;letter-spacing:.08em}
  .quote{margin:32px 0 28px;font-size:12px;color:#6a6a6a;font-style:italic;letter-spacing:.06em}
  .quote::before{content:"— ";color:#444}
  .actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .retry{display:inline-block;padding:10px 26px;border:1px solid #3a3a3a;color:#cfcfcf;background:transparent;text-decoration:none;font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-family:inherit;cursor:pointer;transition:border-color .3s,color .3s,background .3s}
  .retry:hover,.retry:focus{border-color:#a8a8a8;color:#fff;background:rgba(255,255,255,.02);outline:none}
  a.home{font-size:10px;letter-spacing:.24em;color:#5a5a5a;text-decoration:none;text-transform:uppercase;margin-top:6px}
  a.home:hover{color:#888}
  footer{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.32em;color:#3a3a3a;text-transform:uppercase}
  @media (prefers-reduced-motion:reduce){.grey-orb{animation:none}}
</style>
</head>
<body>
  <div class="grey-orb" aria-hidden="true"></div>
  <div class="label" data-i18n="offline.label">offline / 50%</div>
  <h1 data-i18n="offline.title">the connection is grey</h1>
  <p class="jp" data-i18n="offline.body_jp">接続が途切れています。<br>でも、グレーは欠落ではありません。</p>
  <p data-i18n="offline.body_en">Networks fail. Signals fade. The world is still here, just unobserved.</p>
  <div class="quote" data-i18n="offline.quote">observe, and the 50% becomes 101%.</div>
  <div class="actions">
    <button type="button" id="retry-btn" class="retry" data-i18n="offline.retry">retry</button>
    <a href="/" class="home" data-i18n="offline.home">return to inryokü</a>
  </div>
  <footer data-i18n="offline.footer">inryokü — 見えないものの可視化</footer>
  <div class="i18n-toggle-host" aria-hidden="true"></div>
  <script src="/i18n.js" defer></script>
  <link rel="stylesheet" href="/i18n.css">
  <script>
    // CSP 厳格化(Phase 1): javascript: URL を廃し button + addEventListener に変更
    (function(){
      var btn = document.getElementById('retry-btn');
      if (btn) {
        btn.addEventListener('click', function(){ location.reload(); });
      }
      // オンライン復帰を検知したら自動で再読み込みを案内
      window.addEventListener('online', function(){
        if (btn) { btn.textContent = 'reconnect'; btn.style.borderColor = '#a8a8a8'; btn.style.color = '#fff'; }
      });
    })();
  </script>
</body>
</html>
